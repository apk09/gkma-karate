
<!DOCTYPE html>

<html>

    <head>
        <title>Events - Goju-Ryu Karate-Do Martial Arts Association(G.K.M.A)</title>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="keywords" content='GKMA,GKMA Karate,GKMA1996,GKMA Website,GKMA India,Goju-Ryu,Karate,GKMA Homepage' />
        <meta name="description" content='Welcome to the official website of Goju-Ryu Karate-Do Martial Arts Association(G.K.M.A) which was founded in 1996 by our Founder & President Shihan Prem N. Khadka' />
        <meta name="robots" content='all' />
        <link rel="shortcut icon" type="image/x-icon" href="./assets/images/gkma_association_logo.png" alt="gkma_logo_image">
        <link rel="stylesheet" type="text/css" href="./assets/css/style.css">
    </head>

    <body>

        <!-- NAV STARTS HERE -->
        <nav class="navbar navbar-expand-sm navbar-dark bg-dark sticky-top">
            <div class="container">
                <a class="navbar-brand" href="index.html">GKMA Karate</a>
                <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarText" aria-controls="navbarText" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarText">
                    <ul class="navbar-nav ml-auto">
                        <li class="nav-item">
                            <a class="nav-link" href="index.html">Home <span class="sr-only">(current)</span></a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="./news.html">News</a>
                        </li>
                        <li class="nav-item active">
                            <a class="nav-link" href="./events.html">Events</a>
                        </li>
                        <li class="nav-item dropdown">
                            <a class="nav-link dropdown-toggle" href="#" id="navbarDropdownMenuLink" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">Structure</a>
                            <div class="dropdown-menu" aria-labelledby="navbarDropdownMenuLink">
                                <a class="dropdown-item" href="./members.html">Members</a>
                                <a class="dropdown-item" href="./dojo_instructors.html">Dojo Instructors</a>
                                <a class="dropdown-item" href="./black_belts.html">Black Belts</a>
                            </div>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
        <!-- NAV ENDS HERE -->

        <!-- HEADER STARTS HERE -->
        <header>
            <div class="jumbotron">
                <h3 class="text-center">G.K.M.A EVENTS</h3>    
            </div>
        </header>
        <!-- HEADER ENDS HERE -->

        <!-- EVENTS STARTS HERE -->
        <main>
            <div class="container">
                <div id="gkma_eventsDisplay">
                </div>
            </div>
        </main>
        <!-- EVENTS ENDS HERE -->
        
        <!-- FOOTER STARTS HERE -->
        <gkma-footer></gkma-footer>
        <!-- FOOTER ENDS HERE -->

        <!-- EVENTS TEMPLATE STARTS HERE -->
        <script id="gkma_eventsTemplate" type="text/template">
            <div id="accordion">
                {{#.}}
                <div class="card">
                    <div class="card-header" style="cursor: pointer;">
                        <h5 class="mb-0 btn-link" data-toggle="collapse" data-target="#{{event_identifier}}"> {{event_name}} </h5>
                    </div>
                    <!-- <div id="{{event_identifier}}" class="collapse {{isCollapsed}}" data-parent="#accordion">
                            <img src="./assets/images/{{event_image}}" class="img-fluid" alt="gkma_championship poster">
                    </div> -->
                    <div id="{{event_identifier}}" class="collapse {{isCollapsed}}" data-parent="#accordion">
                        <p>Date: {{event_date}}</p>
                    </div>
                </div>
                {{/.}}
            </div>
        </script>
        <!-- EVENTS TEMPLATE ENDS HERE -->

        <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
        <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/mustache.js/2.3.0/mustache.min.js"></script>
        <script src="./assets/js/main.js"></script>
        <script src="./assets/js/events.js" type="text/javascript"></script>

    </body>

</html>
